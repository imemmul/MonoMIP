random_seed: 666

dataset:
  type: &dataset_type 'KITTI'
  root_dir: 'data/KITTI'
  train_split: 'train'
  test_split: 'val'
  batch_size: 8
  use_3d_center: True
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'
  meanshape: False
  writelist: ['Car']
  clip_2d: False

  aug_pd: True
  aug_crop: True
  aug_calib: True

  random_flip: 0.5
  random_crop: 0.5
  random_mixup3d: 0.5
  scale: 0.05
  shift: 0.05

  depth_scale: 'none'

model_name: 'monomip'
model:
  num_classes: 3
  return_intermediate_dec: True
  device: 'cuda'

  backbone: 'resnet50'
  train_backbone: True
  num_feature_levels: 4
  bev_num_feature_levels: 4
  dilation: False
  position_embedding: 'sine'
  masks: False

  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 60.0
  ipm_heights: [0.25, 0.75, 1.25, 1.65]
  bev_feat_source: 'memory'
  mh_representation: 'ground_contrast'

  with_box_refine: True
  use_dn: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  group_num: 11
  use_det2d_group_num: True
  enc_n_points: 4
  dec_n_points: 4

  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

  aux_loss: True
  cls_loss_coef: 2
  focal_alpha: 0.25
  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1
  region_loss_coef: 1

  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10
  set_cost_bevcenter: 100

optimizer:
  type: 'adamw'
  lr: 0.0002
  weight_decay: 0.0001

lr_scheduler:
  type: 'step'
  warmup: False
  decay_rate: 0.5
  decay_list: [85, 125, 165, 205]

trainer:
  max_epoch: 250
  gpu_ids: '0'
  save_frequency: 1
  save_path: 'outputs/monomip_car/'
  save_all: False
  use_dn: False
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

tester:
  type: *dataset_type
  mode: single
  checkpoint: 195
  threshold: 0.2
  topk: 50
  bev_nms_iou: null
